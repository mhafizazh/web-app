<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F1F4" id="metaThemeColor" />
    <title>Eve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Onboarding (first launch) -->
    <div id="onboarding" class="onboarding hidden" aria-label="Onboarding">
      <div class="onboard-card card raised" id="onboardCard"></div>
    </div>

    <!-- App shell -->
    <div id="app" class="app hidden">
      <header class="app-header">
        <div class="header-top">
          <p class="kicker" id="kicker"></p>
          <div class="header-actions">
            <div class="theme-toggle segmented inset" role="group" aria-label="Theme">
              <button type="button" class="seg" data-theme-choice="light" id="themeLight">Light</button>
              <button type="button" class="seg" data-theme-choice="berry" id="themeBerry">Berry</button>
            </div>
            <button type="button" class="icon-pill raised" id="watchStatusBtn" aria-label="Watch connected">⌚ <span class="watch-dot" aria-hidden="true"></span></button>
          </div>
        </div>
        <h1 class="app-title">Live fully. Eve has your back.</h1>
        <p class="subline">Eve turns your body's signals into calm, simple wisdom.</p>
      </header>

      <main class="screens">
        <!-- Map tab -->
        <section id="tab-map" class="tab-screen" aria-label="Map">
          <div class="segmented inset range-control" role="group" aria-label="Range">
            <button type="button" class="seg" data-range="day">Day</button>
            <button type="button" class="seg" data-range="week">Week</button>
            <button type="button" class="seg" data-range="month">Month</button>
          </div>

          <div class="card raised map-card">
            <div class="map-area" id="mapArea" role="img" aria-label="Map of moments"></div>
            <div class="chips" id="mapFilters" role="group" aria-label="Map filters">
              <button type="button" class="chip" data-filter="all">All</button>
              <button type="button" class="chip" data-filter="good"><span class="shape circle good"></span> Good</button>
              <button type="button" class="chip" data-filter="bad"><span class="shape circle bad"></span> Bad</button>
              <button type="button" class="chip" data-filter="unsafe"><span class="shape diamond unsafe"></span> Unsafe</button>
            </div>
            <label class="toggle-row community-toggle">
              <span>Show what other women shared</span>
              <button type="button" class="switch" id="communityToggle" role="switch" aria-checked="false"><span class="knob"></span></button>
            </label>
          </div>

          <div id="pinDetail" class="card raised pin-detail hidden"></div>

          <div class="card raised summary-card" id="summaryCard"></div>
          <div class="card raised when-card" id="whenCard"></div>
        </section>

        <!-- Moments tab -->
        <section id="tab-moments" class="tab-screen hidden" aria-label="Moments">
          <div class="card raised" id="watchCheckins" aria-live="polite"></div>
          <div class="segmented inset moments-tabs" id="momentsTabs" role="tablist"></div>
          <p class="insight" id="momentsInsight"></p>
          <div id="momentsContent"></div>
        </section>

        <!-- Safety tab -->
        <section id="tab-safety" class="tab-screen hidden" aria-label="Safety">
          <div id="safetyContent"></div>
        </section>

        <!-- Me tab -->
        <section id="tab-me" class="tab-screen hidden" aria-label="Me">
          <div id="meContent"></div>
        </section>
      </main>

    </div>

    <!-- Keep navigation outside the scrolling app content so it stays fixed on mobile. -->
    <nav class="bottom-nav" aria-label="Main">
      <button type="button" class="nav-item active" data-tab="map" aria-label="Map"><span class="nav-icon">🗺️</span><span>Map</span></button>
      <button type="button" class="nav-item" data-tab="moments" aria-label="Moments"><span class="nav-icon">✨</span><span>Moments</span></button>
      <button type="button" class="nav-item" data-tab="safety" aria-label="Safety"><span class="nav-icon">🛡️</span><span>Safety</span></button>
      <button type="button" class="nav-item" data-tab="me" aria-label="Me"><span class="nav-icon">🌸</span><span>Me</span></button>
    </nav>

    <!-- Overlays -->
    <div id="overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-sheet card raised" id="overlaySheet" role="dialog" aria-modal="true"></div>
    </div>

    <!-- Simulate watch (dev menu) -->
    <button type="button" class="dev-fab raised" id="devFab" aria-label="Simulate watch">⌚ Simulate watch</button>
    <div id="devPanel" class="dev-panel card raised hidden" aria-label="Simulate watch menu"></div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/seed.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
